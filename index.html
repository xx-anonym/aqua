    <!-- startup-images:end -->
    <title>Aqua – Tauch-Logbuch & Artensammlung</title>
    <!-- Start screen: inline so it shows before any script or stylesheet has loaded.
         src/ui/splash.ts fades it out once the app is ready. -->
    <style>
      #splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        /* --sp-h: full screen height in installed iOS apps (see the script below). */
        height: var(--sp-h, 100%);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        /* Under the gradient: the app's own background once its stylesheet is loaded. */
        background: var(--bg, #05333a);
        transition: opacity 0.35s ease;
      }
      #splash::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(130% 90% at 50% 35%, #0e7f87 0%, #08464d 55%, #04252b 100%);
        transition: opacity 0.3s ease;
      }
      #splash > * {
        position: relative;
        transition: opacity 0.2s ease, transform 0.25s ease-in;
      }
      /* Leaving: one continuous cross-fade into the app. The fish swims off while the gradient
         gives way to the app's background colour and the whole layer fades at the same time,
         so there is no empty moment between start screen and app (seen on iOS before 0.7.8,
         when the plain layer only faded after the fish had gone). */
      #splash[data-state='leaving'] {
        opacity: 0;
        pointer-events: none;
      }
      #splash[data-state='leaving']::before,
      #splash[data-state='leaving'] > * {
        opacity: 0;
      }
      #splash[data-state='leaving'] .sp-scene {
        transform: translateX(-36px);
      }
      #splash .sp-scene {
        width: 136px;
        height: 136px;
        overflow: visible;
      }
      #splash .sp-name {
        width: 72px;
        height: 34px;
      }
      /* The app renders underneath while the start screen is up; keep it hidden until the
         fade starts, so no part of it can show through (seen on iOS right after launch). */
      #splash:not([data-state='leaving']) ~ #root {
        visibility: hidden;
      }
      html:has(#splash:not([data-state='leaving'])),
      html:has(#splash:not([data-state='leaving'])) body {
        background: #05333a;
      }
      #splash .sp-wave {
        width: 96px;
        height: 12px;
      }
      .sp-fish {
        transform-origin: 234px 264px;
        animation: sp-swim 2.8s ease-in-out infinite;
      }
      .sp-tail {
        transform-origin: 300px 264px;
        animation: sp-tail 0.55s ease-in-out infinite alternate;
      }
      .sp-bubble {
        opacity: 0;
        animation: sp-rise 2.4s ease-in infinite;
      }
      .sp-bubble.b2 {
        animation-delay: 0.8s;
      }
      .sp-bubble.b3 {
        animation-delay: 1.6s;
      }
      .sp-wave path {
        animation: sp-flow 1.1s linear infinite;
      }
      @keyframes sp-swim {
        0%,
        100% {
          transform: translate(-5px, 6px) rotate(2deg);
        }
        50% {
          transform: translate(5px, -8px) rotate(-3deg);
        }
      }
      @keyframes sp-tail {
        from {
          transform: rotate(-9deg) scaleX(0.92);
        }
        to {
          transform: rotate(9deg) scaleX(1);
        }
      }
      @keyframes sp-rise {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.4);
        }
        15% {
          opacity: 0.9;
        }
        55% {
          transform: translate(10px, -100px) scale(0.8);
        }
        100% {
          opacity: 0;
          transform: translate(-8px, -190px) scale(1.1);
        }
      }
      @keyframes sp-flow {
        to {
          transform: translateX(-24px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sp-fish,
        .sp-tail,
        .sp-wave path {
          animation: none;
        }
        .sp-bubble {
          animation: none;
          opacity: 0.8;
        }
        #splash[data-state='leaving'] .sp-scene {
          transform: none;
        }
      }
    </style>
    <script>
      // Installed iOS apps start with a viewport a bit shorter than the screen and then grow it,
      // which made the centred start screen jump. Pin it to the screen height, as on the iOS
      // startup image.
      if (navigator.standalone) document.documentElement.style.setProperty('--sp-h', screen.height + 'px');
    </script>
  </head>
  <body>

        <g fill="none" stroke="#bfeef0">

          <circle class="sp-bubble b3" cx="78" cy="252" r="12" stroke-width="6" style="transform-origin: 78px 252px" />
        </g>

      <svg class="sp-wave" viewBox="0 0 96 12">
        <path
          d="M0 6q6-5 12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0"

        />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
