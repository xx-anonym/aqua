<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b5f66" />
    <meta name="description" content="Meerestiere bestimmen, Tauchgänge loggen und jede gesichtete Art sammeln – auch offline." />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Aqua – Tauch-Logbuch & Artensammlung</title>
    <!-- Start screen: inline so it shows before any script or stylesheet has loaded.
         src/ui/splash.ts fades it out once the app is ready. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(130% 90% at 50% 35%, #0e7f87 0%, #08464d 55%, #04252b 100%);
        color: #f4fbfb;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      #splash[data-state='leaving'] {
        opacity: 0;
        transform: scale(1.06);
        pointer-events: none;
      }
      #splash .sp-scene {
        width: 136px;
        height: 136px;
        overflow: visible;
      }
      #splash .sp-name {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      #splash .sp-wave {
        width: 96px;
        height: 12px;
        opacity: 0.75;
      }
      .sp-fish {
        transform-origin: 234px 264px;
        animation: sp-swim 2.8s ease-in-out infinite;
      }
      .sp-tail {
        transform-origin: 300px 264px;
        animation: sp-tail 0.55s ease-in-out infinite alternate;
      }
      .sp-bubble {
        opacity: 0;
        animation: sp-rise 2.4s ease-in infinite;
      }
      .sp-bubble.b2 {
        animation-delay: 0.8s;
      }
      .sp-bubble.b3 {
        animation-delay: 1.6s;
      }
      .sp-wave path {
        animation: sp-flow 1.1s linear infinite;
      }
      @keyframes sp-swim {
        0%,
        100% {
          transform: translate(-5px, 6px) rotate(2deg);
        }
        50% {
          transform: translate(5px, -8px) rotate(-3deg);
        }
      }
      @keyframes sp-tail {
        from {
          transform: rotate(-9deg) scaleX(0.92);
        }
        to {
          transform: rotate(9deg) scaleX(1);
        }
      }
      @keyframes sp-rise {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.4);
        }
        15% {
          opacity: 0.9;
        }
        55% {
          transform: translate(10px, -100px) scale(0.8);
        }
        100% {
          opacity: 0;
          transform: translate(-8px, -190px) scale(1.1);
        }
      }
      @keyframes sp-flow {
        to {
          transform: translateX(-24px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sp-fish,
        .sp-tail,
        .sp-wave path {
          animation: none;
        }
        .sp-bubble {
          animation: none;
          opacity: 0.8;
        }
        #splash {
          transition: opacity 0.2s linear;
        }
        #splash[data-state='leaving'] {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="sp-scene" viewBox="56 40 340 340">
        <g class="sp-fish">
          <path class="sp-tail" d="M290 230l82-52v172l-82-52z" fill="#f4fbfb" />
          <path d="M96 268c40-66 126-92 206-46v84c-80 46-166 22-206-38z" fill="#f4fbfb" />
          <circle cx="166" cy="252" r="13" fill="#06343b" />
          <path d="M214 214c14 22 14 58 0 80" fill="none" stroke="#06343b" stroke-width="12" stroke-linecap="round" opacity=".35" />
        </g>
        <g fill="none" stroke="#bfeef0">
          <circle class="sp-bubble" cx="84" cy="236" r="14" stroke-width="7" style="transform-origin: 84px 236px" />
          <circle class="sp-bubble b2" cx="100" cy="246" r="10" stroke-width="6" style="transform-origin: 100px 246px" />
          <circle class="sp-bubble b3" cx="78" cy="252" r="12" stroke-width="6" style="transform-origin: 78px 252px" />
        </g>
      </svg>
      <div class="sp-name">Aqua</div>
      <svg class="sp-wave" viewBox="0 0 96 12">
        <path
          d="M0 6q6-5 12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0"
          fill="none"
          stroke="#bfeef0"
          stroke-width="2.5"
          stroke-linecap="round"
        />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
